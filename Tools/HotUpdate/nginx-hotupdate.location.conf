# Optional location snippet for an EXISTING nginx server listening on 18761.
# Review/merge the location and run nginx -t before reloading. Do not replace the
# existing server config or the legacy /StandaloneWindows64 location.
location ^~ /client-hotupdate/windows-mono-v1/ {
    alias /srv/hundun-resources/client-hotupdate/windows-mono-v1/;
    autoindex off;
    open_file_cache off;
    etag off;
    if_modified_since off;
    gzip off;
    default_type application/octet-stream;
    types { application/json json; application/octet-stream bundle bytes hash; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
